{% extends "base.html" %}

{% block title %}Contraseña actualizada - TicketFlow{% endblock %}

{% block content %}
<div class="tf-auth-card">
    <div class="tf-auth-card__body text-center py-5">
        <span class="tf-icon-tile tf-icon-tile--green mb-3"><span class="tf-icon" aria-hidden="true">check_circle</span></span>
        <h1 class="tf-h-md mb-2">Contraseña actualizada</h1>
        <p class="tf-text-2">Tu contraseña fue actualizada correctamente. Ya puedes iniciar sesión.</p>
        <a class="btn btn-primary" href="{% url 'users:login' %}">Iniciar sesión</a>
    </div>
</div>
{% endblock %}
