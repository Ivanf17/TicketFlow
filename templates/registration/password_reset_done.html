{% extends "base.html" %}

{% block title %}Recuperar contraseña - TicketFlow{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h1 class="h3 mb-3">Revisa tu correo</h1>
        <p>
            Si existe una cuenta asociada a ese correo electrónico, te hemos
            enviado instrucciones para restablecer tu contraseña.
        </p>
        <a class="btn btn-outline-primary btn-sm" href="{% url 'users:login' %}">Volver a iniciar sesión</a>
    </div>
</div>
{% endblock %}
