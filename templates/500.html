<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error del servidor - TicketFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/ticketflow.css' %}">
</head>
<body>
    <div class="tf-auth">
        <main class="tf-auth__main">
            <div class="tf-card tf-error">
                <div class="tf-card__body tf-card__body--lg">
                    <div class="tf-error__code">500</div>
                    <h1 class="tf-h-lg mt-2">Error del servidor</h1>
                    <p class="tf-text-2 mt-2">Ocurrió un error inesperado. Intenta nuevamente en unos minutos.</p>
                    <a class="btn btn-primary mt-2" href="/">Volver al inicio</a>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
